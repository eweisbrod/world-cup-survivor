<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Survivor Pool — World Cup 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060b;
    --surface: rgba(255,255,255,0.022);
    --border: rgba(255,255,255,0.05);
    --orange: #ff8c00;
    --orange-dim: rgba(255,140,0,0.12);
    --green: #3ddc84;
    --green-dim: rgba(61,220,132,0.08);
    --red: #ff5252;
    --red-dim: rgba(255,82,82,0.08);
    --yellow: #ffcc44;
    --yellow-dim: rgba(255,204,68,0.06);
    --text: #e8e8f0;
    --text-dim: rgba(255,255,255,0.35);
    --mono: 'JetBrains Mono', monospace;
    --display: 'Oswald', sans-serif;
    --east: #4a8fe7;
    --west: #c56cf0;
    --midwest: #3ddc84;
    --south: #ff5252;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--mono); cursor: pointer; }
  input { font-family: var(--mono); }

  /* ── Login ── */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,140,0,0.04) 0%, transparent 60%), var(--bg);
  }
  .login-card { max-width: 380px; width: 100%; text-align: center; }
  .login-ball { font-size: 52px; margin-bottom: 8px; filter: drop-shadow(0 0 20px rgba(255,120,0,0.2)); }
  .login-title {
    font-family: var(--display); font-size: 32px; font-weight: 700;
    letter-spacing: 4px; color: var(--orange); text-transform: uppercase;
  }
  .login-sub {
    font-size: 10px; letter-spacing: 5px; color: var(--text-dim); margin-bottom: 32px;
    text-transform: uppercase;
  }
  .login-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px;
  }
  .login-label { font-size: 9px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 14px; text-transform: uppercase; }
  .login-input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,140,0,0.2);
    border-radius: 8px; color: var(--text); outline: none;
    transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--orange); }
  .login-btn {
    width: 100%; margin-top: 14px; padding: 13px 0; font-size: 13px;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    background: var(--orange); color: #000; border: none; border-radius: 8px;
    transition: transform 0.1s, opacity 0.1s;
  }
  .login-btn:hover { opacity: 0.9; }
  .login-btn:active { transform: scale(0.98); }
  .login-players { margin-top: 20px; font-size: 10px; color: var(--text-dim); line-height: 1.7; }

  /* ── Header ── */
  .header {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-title { font-family: var(--display); font-size: 16px; font-weight: 700; color: var(--orange); letter-spacing: 3px; }
  .header-sub { font-size: 9px; color: var(--text-dim); }
  .header-btns { display: flex; gap: 5px; }
  .hbtn {
    padding: 6px 10px; font-size: 8px; letter-spacing: 1.5px; font-weight: 700;
    background: var(--surface); color: rgba(255,255,255,0.6);
    border: 1px solid var(--border); border-radius: 5px;
    transition: all 0.15s;
  }
  .hbtn:hover { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8); }
  .hbtn.active { background: var(--orange); color: #000; border-color: var(--orange); }
  .fetch-time { padding: 1px 16px; font-size: 8px; color: var(--text-dim); opacity: 0.5; }

  /* ── Day Tabs ── */
  .day-scroll {
    display: flex; gap: 4px; padding: 10px 14px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-tab {
    padding: 8px 11px; min-width: 62px; flex-shrink: 0;
    border: 2px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text); text-align: center;
    transition: all 0.15s;
  }
  .day-tab:hover:not(.active) { border-color: rgba(255,255,255,0.12); }
  .day-tab.active { border-color: var(--orange); background: var(--orange-dim); color: var(--orange); }
  .day-tab.has-won { border-color: rgba(61,220,132,0.4); }
  .day-tab.has-lost { border-color: rgba(255,82,82,0.4); }
  .day-tab.has-pick { border-color: rgba(255,204,68,0.3); }
  .day-tab.dim { opacity: 0.3; }
  .day-label { font-size: 10px; font-weight: 700; }
  .day-round { font-size: 7px; opacity: 0.4; letter-spacing: 1px; margin-top: 1px; }
  .day-pick-tag {
    font-size: 7px; margin-top: 4px; padding: 1px 5px; border-radius: 3px;
    max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: inline-block;
  }

  /* ── Pick Banner ── */
  .pick-banner {
    margin: 0 14px 6px; padding: 9px 13px; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pick-banner-label { font-size: 8px; color: var(--text-dim); letter-spacing: 2px; }
  .pick-banner-team { font-size: 15px; font-weight: 700; }
  .change-btn {
    padding: 4px 10px; font-size: 8px; letter-spacing: 1px;
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 4px;
    transition: border-color 0.15s;
  }
  .change-btn:hover { border-color: rgba(255,255,255,0.15); }

  /* ── Matchup Cards ── */
  .matchups { padding: 4px 14px 100px; }
  .matchup-card {
    margin-bottom: 7px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px;
    animation: fadeSlide 0.2s ease both;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .matchup-card:nth-child(2) { animation-delay: 0.02s; }
  .matchup-card:nth-child(3) { animation-delay: 0.04s; }
  .matchup-card:nth-child(4) { animation-delay: 0.06s; }
  .matchup-card:nth-child(5) { animation-delay: 0.08s; }
  .matchup-meta {
    display: flex; justify-content: space-between; margin-bottom: 6px; padding: 0 2px;
  }
  .matchup-region { font-size: 8px; letter-spacing: 2px; font-weight: 700; }
  .matchup-time { font-size: 8px; color: var(--text-dim); }
  .matchup-row { display: flex; align-items: center; gap: 6px; }
  .vs { font-size: 8px; font-weight: 800; letter-spacing: 2px; opacity: 0.15; min-width: 26px; text-align: center; flex-shrink: 0; }

  /* ── Team Button ── */
  .team-btn {
    flex: 1; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 7px; background: rgba(255,255,255,0.02);
    color: var(--text); text-align: left;
    display: flex; align-items: center; gap: 8px;
    transition: all 0.12s;
  }
  .team-btn:hover:not(.disabled):not(.tbd) { border-color: rgba(255,255,255,0.15); }
  .team-btn:active:not(.disabled) { transform: scale(0.98); }
  .team-btn.picked { border-color: var(--east); background: rgba(74,143,231,0.1); color: var(--east); }
  .team-btn.lost { background: var(--red-dim); border-color: rgba(255,82,82,0.12); color: var(--red); }
  .team-btn.used { opacity: 0.3; cursor: not-allowed; }
  .team-btn.disabled { cursor: not-allowed; }
  .team-btn.tbd { opacity: 0.12; cursor: default; }
  .team-seed { font-size: 9px; opacity: 0.4; font-weight: 800; min-width: 14px; }
  .team-name { font-size: 12px; font-weight: 600; flex: 1; }
  .team-name.struck { text-decoration: line-through; }
  .team-badge { font-size: 8px; letter-spacing: 1px; opacity: 0.5; }

  /* ── Board ── */
  .board-wrap { padding: 12px; overflow-x: auto; }
  .board { display: grid; gap: 1px; font-size: 10px; }
  .b-hdr {
    padding: 7px; background: rgba(255,255,255,0.015);
    font-size: 8px; letter-spacing: 1px; color: var(--text-dim); text-align: center;
  }
  .b-cell { padding: 7px 5px; display: flex; align-items: center; font-size: 9px; }
  .b-cell.center { text-align: center; justify-content: center; }

  /* ── TBD placeholder ── */
  .tbd-slot {
    flex: 1; padding: 11px 12px; text-align: center; font-size: 11px;
    border: 1px dashed rgba(255,255,255,0.05); border-radius: 6px;
    color: rgba(255,255,255,0.12);
  }
  .tbd-msg { text-align: center; padding: 40px 20px; opacity: 0.2; font-size: 11px; letter-spacing: 2px; }

  /* ── Eliminated overlay ── */
  .elim-banner {
    margin: 8px 14px 0; padding: 10px 14px; border-radius: 8px;
    background: var(--red-dim); border: 1px solid rgba(255,82,82,0.15);
    text-align: center; font-size: 10px; color: var(--red); letter-spacing: 1px;
  }

  /* Responsive tweaks */
  @media (max-width: 400px) {
    .team-name { font-size: 11px; }
    .team-btn { padding: 9px 10px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase SDK (compat for simplicity) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ─── Firebase Init ───────────────────────────────────────────────────────────
firebase.initializeApp({
  databaseURL: "https://ncaa-survivor-default-rtdb.firebaseio.com"
});
const db = firebase.database();
const DB_ROOT = "wc26";

// ─── World Cup 2026 Tournament Data ──────────────────────────────────────────

// Round of 32 matchups split into 3 pick windows (2-day blocks)
const R32_W1 = [
  { a:"South Africa", b:"Canada",               t:"3:00p",  g:"A2/B2" },
  { a:"Brazil",       b:"Japan",                t:"12:00p", g:"C1/F2" },
  { a:"Germany",      b:"Paraguay",             t:"3:00p",  g:"E1/D3" },
  { a:"Netherlands",  b:"Morocco",              t:"3:00p",  g:"F1/C2" },
];
const R32_W2 = [
  { a:"Ivory Coast",           b:"Norway",                t:"2:00p",  g:"E2/I2" },
  { a:"France",                b:"Sweden",                t:"3:00p",  g:"I1/F3" },
  { a:"Mexico",                b:"Scotland",              t:"6:00p",  g:"A1/C3" },
  { a:"England",               b:"Cabo Verde",            t:"12:00p", g:"L1/H3" },
  { a:"Egypt",                 b:"Czechia",               t:"5:00p",  g:"G1/A3" },
  { a:"USA",                   b:"Bosnia & Herzegovina",  t:"4:00p",  g:"D1/B3" },
];
const R32_W3 = [
  { a:"Spain",       b:"Austria",   t:"3:00p",  g:"H1/J2" },
  { a:"Switzerland", b:"Belgium",   t:"1:00p",  g:"B1/G3" },
  { a:"Portugal",    b:"Ghana",     t:"1:00p",  g:"K2/L2" },
  { a:"Australia",   b:"Iran",      t:"2:00p",  g:"D2/G2" },
  { a:"Argentina",   b:"Uruguay",   t:"8:00p",  g:"J1/H2" },
  { a:"Colombia",    b:"Croatia",   t:"2:00p",  g:"K1/L3" },
];

// All 16 R32 games in bracket order (indices 0–15 map to matches M73–M88)
const R32_ALL = [...R32_W1, ...R32_W2, ...R32_W3];

// Pick windows — each window is one survivor pick (players pick one team to win)
const DAYS = [
  { id:"r32-w1",   label:"R32 W1",  dates:["2026-06-28","2026-06-29"], round:"Round of 32",
    games: R32_W1.map(g => ({h:{s:null,n:g.a}, l:{s:null,n:g.b}, t:g.t, r:g.g})) },
  { id:"r32-w2",   label:"R32 W2",  dates:["2026-06-30","2026-07-01"], round:"Round of 32",
    games: R32_W2.map(g => ({h:{s:null,n:g.a}, l:{s:null,n:g.b}, t:g.t, r:g.g})) },
  { id:"r32-w3",   label:"R32 W3",  dates:["2026-07-02","2026-07-03"], round:"Round of 32",
    games: R32_W3.map(g => ({h:{s:null,n:g.a}, l:{s:null,n:g.b}, t:g.t, r:g.g})) },
  { id:"r16-w4",   label:"R16 W4",  dates:["2026-07-04","2026-07-05"], round:"Round of 16", games:[] },
  { id:"r16-w5",   label:"R16 W5",  dates:["2026-07-06","2026-07-07"], round:"Round of 16", games:[] },
  { id:"qf-w6",    label:"QF",      dates:["2026-07-09","2026-07-10","2026-07-11"], round:"Quarterfinal", games:[] },
  { id:"sf-w7",    label:"SF",      dates:["2026-07-14","2026-07-15"], round:"Semifinal", games:[] },
  { id:"final-w8", label:"Final",   dates:["2026-07-19"], round:"Final", games:[] },
];

// Maps window ID → array of dates for multi-date result lookup
const WINDOW_DATES = {};
DAYS.forEach(d => { WINDOW_DATES[d.id] = d.dates; });

// Start-date shortcut (used for tab ordering)
const DAY_DATE = {};
DAYS.forEach(d => { DAY_DATE[d.id] = d.dates[0]; });

const REGION_COLORS = {};  // WC uses group context labels, no region colour needed

const ALIASES = {
  "united states":               "USA",
  "united states of america":    "USA",
  "u.s.":                        "USA",
  "us":                          "USA",
  "cote d'ivoire":               "Ivory Coast",
  "c\u00f4te d\u2019ivoire":     "Ivory Coast",
  "ivory coast":                 "Ivory Coast",
  "bosnia and herzegovina":      "Bosnia & Herzegovina",
  "bosnia-herzegovina":          "Bosnia & Herzegovina",
  "bih":                         "Bosnia & Herzegovina",
  "netherlands":                 "Netherlands",
  "holland":                     "Netherlands",
  "czech republic":              "Czechia",
  "cabo verde":                  "Cabo Verde",
  "cape verde":                  "Cabo Verde",
  "iran (islamic republic of)":  "Iran",
  // FIFA / ESPN abbreviations
  "bra":"Brazil",   "ger":"Germany",  "ned":"Netherlands", "nor":"Norway",
  "swe":"Sweden",   "por":"Portugal", "esp":"Spain",       "arg":"Argentina",
  "col":"Colombia", "mex":"Mexico",   "eng":"England",     "fra":"France",
  "sui":"Switzerland","bel":"Belgium","aut":"Austria",     "cro":"Croatia",
  "uru":"Uruguay",  "iri":"Iran",     "aus":"Australia",   "jpn":"Japan",
  "gha":"Ghana",    "egy":"Egypt",    "cze":"Czechia",     "par":"Paraguay",
  "sco":"Scotland", "rsa":"South Africa","can":"Canada",   "cpv":"Cabo Verde",
};

// All teams in this tournament
const ALL_TEAMS = new Set(R32_ALL.flatMap(g => [g.a, g.b]));
const TEAM_LIST = [...ALL_TEAMS];

function matchTeam(api) {
  if (!api) return null;
  const n = api.toLowerCase().trim();
  const exact = TEAM_LIST.find(t => t.toLowerCase() === n);
  if (exact) return exact;
  if (ALIASES[n]) return ALIASES[n];
  return TEAM_LIST.find(t => n.includes(t.toLowerCase()) || t.toLowerCase().includes(n)) || null;
}


// ─── State ───────────────────────────────────────────────────────────────────
let state = {
  player: localStorage.getItem("wc26-player") || "",
  players: [],
  picks: {},
  results: {},
  dayIdx: 0,
  board: false,
  fetchTime: null,
  debugLog: [],
  loading: true,
};

// ─── Firebase listeners ──────────────────────────────────────────────────────
db.ref(DB_ROOT + "/players").on("value", snap => {
  state.players = snap.val() || [];
  render();
});
db.ref(DB_ROOT + "/picks").on("value", snap => {
  state.picks = snap.val() || {};
  render();
});
db.ref(DB_ROOT + "/results").on("value", snap => {
  state.results = snap.val() || {};
  render();
});

// Mark loading done after first data load
db.ref(DB_ROOT + "/players").once("value", () => {
  state.loading = false;
  const today = new Date().toISOString().slice(0,10);
  let i = DAYS.findIndex(d => d.dates[0] >= today);
  state.dayIdx = i >= 0 ? i : DAYS.length - 1;
  render();
  fetchScores();
});

// ─── Actions ─────────────────────────────────────────────────────────────────
function joinPool(name) {
  name = name.trim();
  if (!name) return;
  state.player = name;
  localStorage.setItem("wc26-player", name);
  if (!state.players.includes(name)) {
    const np = [...state.players, name];
    db.ref(DB_ROOT + "/players").set(np);
  }
  render();
}

function makePick(team, dayId) {
  if (!state.player || team === "TBD") return;
  db.ref(DB_ROOT + "/picks/" + state.player + "/" + dayId).set(team);
}

function clearPick(dayId) {
  if (!state.player) return;
  db.ref(DB_ROOT + "/picks/" + state.player + "/" + dayId).remove();
}

function logout() {
  state.player = "";
  localStorage.removeItem("wc26-player");
  render();
}

function removePlayer(name) {
  if (!confirm("Remove " + name + " from the pool? This deletes all their picks.")) return;
  const np = state.players.filter(p => p !== name);
  db.ref(DB_ROOT + "/players").set(np);
  db.ref(DB_ROOT + "/picks/" + name).remove();
  if (state.player === name) logout();
}

// ─── Score Fetching ──────────────────────────────────────────────────────────
async function fetchScores() {
  const dbg = [];
  function log(msg) { dbg.push(msg); console.log("[Scores]", msg); }
  try {
  const today = new Date().toISOString().slice(0,10);
  log("today=" + today);

  // Collect all individual dates from windows that have already started
  const dates = [...new Set(
    DAYS.flatMap(d => d.dates).filter(dt => dt <= today)
  )].sort();
  log("dates=" + dates.join(","));

  let changed = false;
  const nr = { ...state.results };

  function recordResult(wn, ln, date) {
    const mw = matchTeam(wn), ml = matchTeam(ln);
    if (!nr[date]) nr[date] = {};
    if (mw && nr[date][mw] !== "won") { nr[date][mw] = "won"; changed = true; log("W " + mw + " @" + date); }
    if (ml && nr[date][ml] !== "lost") { nr[date][ml] = "lost"; changed = true; log("L " + ml + " @" + date); }
    return mw || ml ? 1 : 0;
  }

  // ESPN soccer / FIFA World Cup endpoint
  const ESPN = "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard";

  // Fetch all dates in parallel
  const espnFetches = dates.map(dt =>
    fetch(ESPN + "?dates=" + dt.replace(/-/g, "") + "&limit=50")
      .then(r => { log("espn " + dt + " http" + r.status); return r.ok ? r.json() : null; })
      .catch(e => { log("espn " + dt + " ERR:" + e.message); return null; })
  );

  const allResults = await Promise.all(espnFetches);
  log("fetches done");

  for (let i = 0; i < dates.length; i++) {
    const data = allResults[i];
    const events = data?.events || [];
    let mc = 0, completed = 0, notDone = 0;
    const unmatched = [];
    for (const ev of events) {
      const comp = ev.competitions?.[0];
      if (!comp) continue;
      if (!ev.status?.type?.completed) { notDone++; continue; }
      completed++;
      const teams = comp.competitors || [];
      const winner = teams.find(t => t.winner);
      const loser  = teams.find(t => !t.winner);
      if (!winner || !loser) continue;
      const wn = winner.team?.shortDisplayName || winner.team?.displayName || winner.team?.abbreviation || "";
      const ln = loser.team?.shortDisplayName  || loser.team?.displayName  || loser.team?.abbreviation  || "";
      const matched = recordResult(wn, ln, dates[i]);
      mc += matched;
      if (!matched) unmatched.push(wn + "/" + ln);
    }
    log("espn " + dates[i] + " " + events.length + "ev " + completed + "done " + notDone + "live " + mc + "m");
    if (unmatched.length) log("  unmatched: " + unmatched.slice(0,5).join(", "));
    if (events.length === 0) log("  (empty - keys: " + Object.keys(data||{}).join(",") + ")");
  }

  log("results=" + JSON.stringify(nr));

  if (changed) {
    // Firebase keys cannot contain . # $ / [ ]
    const fbKey = s => s.replace(/[.#$/[\]]/g, "_");
    const cleanResults = {};
    for (const [date, teams] of Object.entries(nr)) {
      cleanResults[date] = {};
      for (const [k,v] of Object.entries(teams)) { if (v) cleanResults[date][fbKey(k)] = v; }
    }
    try { await db.ref(DB_ROOT + "/results").set(cleanResults); } catch(e) { log("FB results err: " + e.message); }
  }
  } catch(e) { log("CRASH: " + e.message + " " + e.stack); }
  state.fetchTime = new Date().toLocaleTimeString();
  state.debugLog = dbg;
  render();
}

// ─── World Cup Bracket Builder ────────────────────────────────────────────────

// Per-date result helpers
function teamAdvanced(t) { return Object.values(state.results).some(dr => dr[t] === "won"); }
function teamEliminated(t) { return Object.values(state.results).some(dr => dr[t] === "lost"); }

function buildDays() {
  // Returns "winner" of a single-elimination game between two known teams.
  // Winner is identified by the opponent having lost (result is in DB).
  function gameWinner(a, b) {
    if (a === "TBD" || b === "TBD") return "TBD";
    if (teamEliminated(a)) return b;
    if (teamEliminated(b)) return a;
    return "TBD"; // game not yet decided
  }

  // 16 R32 winners (indices 0–15 correspond to matches M73–M88)
  const rw = R32_ALL.map(g => gameWinner(g.a, g.b));

  // Round of 16 pairings (official FIFA 2026 bracket structure)
  // M89: W(M73) vs W(M75), M90: W(M74) vs W(M77)
  // M91: W(M76) vs W(M78), M92: W(M79) vs W(M80)
  // M93: W(M81) vs W(M82), M94: W(M83) vs W(M84)
  // M95: W(M85) vs W(M86), M96: W(M87) vs W(M88)
  const r16 = [
    { a:rw[0],  b:rw[2]  },  // W(M73) vs W(M75) — Window 4
    { a:rw[1],  b:rw[4]  },  // W(M74) vs W(M77)
    { a:rw[3],  b:rw[5]  },  // W(M76) vs W(M78)
    { a:rw[6],  b:rw[7]  },  // W(M79) vs W(M80)
    { a:rw[8],  b:rw[9]  },  // W(M81) vs W(M82) — Window 5
    { a:rw[10], b:rw[11] },  // W(M83) vs W(M84)
    { a:rw[12], b:rw[13] },  // W(M85) vs W(M86)
    { a:rw[14], b:rw[15] },  // W(M87) vs W(M88)
  ];

  const r16w = r16.map(p => gameWinner(p.a, p.b));  // 8 R16 winners

  // Quarterfinal pairings (official FIFA 2026 bracket structure)
  // QF1 (Jul 9, Boston):    W(M89) vs W(M90) → r16w[0] vs r16w[1]
  // QF2 (Jul 10, LA):       W(M93) vs W(M94) → r16w[4] vs r16w[5]
  // QF3 (Jul 11, Miami):    W(M91) vs W(M92) → r16w[2] vs r16w[3]
  // QF4 (Jul 11, KC):       W(M95) vs W(M96) → r16w[6] vs r16w[7]
  const qf = [
    { a:r16w[0], b:r16w[1] },  // QF1
    { a:r16w[4], b:r16w[5] },  // QF2
    { a:r16w[2], b:r16w[3] },  // QF3
    { a:r16w[6], b:r16w[7] },  // QF4
  ];

  const qfw = qf.map(p => gameWinner(p.a, p.b));  // 4 QF winners

  // Semifinal pairings
  // SF1 (Jul 14, Dallas):   W(QF1) vs W(QF2)
  // SF2 (Jul 15, Atlanta):  W(QF3) vs W(QF4)
  const sf = [
    { a:qfw[0], b:qfw[1] },  // SF1
    { a:qfw[2], b:qfw[3] },  // SF2
  ];

  const sfw = sf.map(p => gameWinner(p.a, p.b));  // 2 SF winners

  const toGame = p => ({ h:{s:null, n:p.a}, l:{s:null, n:p.b}, t:"", r:"" });

  const days = DAYS.map(d => ({ ...d, games: [...d.games] }));
  const idx  = id => days.findIndex(d => d.id === id);

  days[idx("r16-w4")].games   = r16.slice(0, 4).map(toGame);
  days[idx("r16-w5")].games   = r16.slice(4).map(toGame);
  days[idx("qf-w6")].games    = qf.map(toGame);
  days[idx("sf-w7")].games    = sf.map(toGame);
  days[idx("final-w8")].games = [{ h:{s:null, n:sfw[0]}, l:{s:null, n:sfw[1]}, t:"", r:"" }];

  return days;
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function parseTimeET(t) {
  const m = t.match(/^(\d+):(\d+)(a|p)$/);
  if (!m) return 0;
  let h = parseInt(m[1]);
  if (m[3] === "p" && h !== 12) h += 12;
  if (m[3] === "a" && h === 12) h = 0;
  return h * 60 + parseInt(m[2]);
}
function nowMinutesET() {
  const s = new Date().toLocaleString("en-US", {timeZone:"America/New_York",hour12:false,hour:"2-digit",minute:"2-digit"});
  const p = s.split(":").map(Number);
  return p[0] * 60 + p[1];
}
// A pick window is "revealed" (picks locked) once its start date has arrived and first game kicked off
function dayRevealed(d) {
  const todayStr = new Date().toISOString().slice(0,10);
  const startDate = d.dates[0];
  if (startDate < todayStr) return true;
  if (startDate > todayStr) return false;
  // Today: lock when first scheduled game kicks off (default noon ET)
  const times = d.games.map(g => g.t).filter(Boolean);
  if (!times.length) return nowMinutesET() >= 720;
  return nowMinutesET() >= Math.min(...times.map(parseTimeET));
}

// Look up a player's pick result for a window (checks all dates in the window)
function pickResult(t, winId) {
  const c = matchTeam(t) || t;
  const dates = WINDOW_DATES[winId] || [];
  for (const date of dates) {
    const r = state.results[date]?.[c];
    if (r) return r;
  }
  return null;
}

// Returns true if ALL players who made a resolved pick in winId all lost.
// When this is true, nobody is eliminated from that window ("keep going" rule).
function allEliminatedInWindow(winId) {
  const pickers = state.players.filter(p => {
    const t = (state.picks[p] || {})[winId];
    return t && pickResult(t, winId) !== null;
  });
  if (pickers.length === 0) return false;
  return pickers.every(p => pickResult((state.picks[p] || {})[winId], winId) === "lost");
}

// A player is eliminated if their pick lost AND it wasn't a mass-elimination round
function isElim(p) {
  return Object.entries(state.picks[p] || {}).some(([winId, t]) =>
    pickResult(t, winId) === "lost" && !allEliminatedInWindow(winId)
  );
}
function winCount(p) { return Object.entries(state.picks[p]||{}).filter(([winId, t]) => pickResult(t, winId)==="won").length; }
function esc(s) { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (state.loading) {
    app.innerHTML = '<div class="login-wrap"><div style="text-align:center"><div style="font-size:48px">\u26BD</div><div style="font-size:11px;letter-spacing:3px;opacity:0.3;margin-top:12px">LOADING...</div></div></div>';
    return;
  }

  if (!state.player) {
    let pList = "";
    if (state.players.length > 0) {
      pList = '<div class="login-players">' + state.players.length + ' player' + (state.players.length!==1?"s":"") + ':<br>' +
        state.players.map(p => '<span style="display:inline-flex;align-items:center;gap:4px;margin:2px 6px 2px 0">' + esc(p) + '<button class="remove-player-btn" data-player="' + esc(p) + '" style="background:none;border:none;color:var(--red);font-size:10px;opacity:0.5;padding:0 2px;cursor:pointer" title="Remove ' + esc(p) + '">\u2717</button></span>').join("") +
      "</div>";
    }
    app.innerHTML =
      '<div class="login-wrap">' +
        '<div class="login-card">' +
          '<div class="login-ball">\u26BD</div>' +
          '<h1 class="login-title">Survivor Pool</h1>' +
          '<div class="login-sub">World Cup 2026 &middot; v1.0</div>' +
          '<div class="login-box">' +
            '<div class="login-label">Enter your name to join</div>' +
            '<input class="login-input" id="nameInput" placeholder="Your name..." autofocus>' +
            '<button class="login-btn" id="joinBtn">JOIN POOL</button>' +
            pList +
          '</div>' +
        '</div>' +
      '</div>';
    const inp = document.getElementById("nameInput");
    const btn = document.getElementById("joinBtn");
    btn.onclick = () => joinPool(inp.value);
    inp.onkeydown = (e) => { if (e.key==="Enter") joinPool(inp.value); };
    document.querySelectorAll(".remove-player-btn").forEach(el => {
      el.addEventListener("click", () => removePlayer(el.dataset.player));
    });
    return;
  }

  const days = buildDays();
  const myPicks = state.picks[state.player] || {};
  const usedTeams = Object.values(myPicks);
  const day = days[state.dayIdx];
  const dayPick = day ? myPicks[day.id] : null;
  const elim = isElim(state.player);
  const w = winCount(state.player);

  let html = "";

  // Header
  html += '<div class="header">' +
    '<div class="header-left">' +
      '<span style="font-size:20px">\u26BD</span>' +
      '<div>' +
        '<div class="header-title">SURVIVOR POOL <span style="font-size:8px;opacity:0.3;letter-spacing:1px">v1.0</span></div>' +
        '<div class="header-sub">' + esc(state.player) +
          (elim ? ' <span style="color:var(--red)">\u2620\uFE0F OUT</span>' : "") +
          (!elim && w > 0 ? ' <span style="color:var(--green)">\u{1F525}' + w + '</span>' : "") +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="header-btns">' +
      '<button class="hbtn' + (state.board?" active":"") + '" id="boardBtn">BOARD</button>' +
      '<button class="hbtn" id="fetchBtn">\u21BB</button>' +
      '<button class="hbtn" id="logoutBtn">SWITCH</button>' +
    '</div>' +
  '</div>';
  if (state.fetchTime) {
    html += '<div class="fetch-time">Scores: ' + state.fetchTime + '</div>';
  }
  // Debug: show fetch log AND current results state
  const allTeamResults = {};
  for (const [date, teams] of Object.entries(state.results)) {
    for (const [t, v] of Object.entries(teams || {})) allTeamResults[t] = (allTeamResults[t]||"") + " " + date.slice(5) + ":" + v;
  }
  const rCount = Object.keys(allTeamResults).length;
  const dbgLines = [
    ...(state.debugLog || []),
    "---",
    "teams tracked: " + rCount,
    ...Object.entries(allTeamResults).map(([t,v]) => t + v)
  ];
  html += '<details style="margin:2px 8px"><summary style="font-size:10px;color:#666;cursor:pointer">debug (' + rCount + ' teams)</summary><div style="font-size:10px;color:#999;background:#1a1a1a;padding:4px 6px;border-radius:4px;max-height:200px;overflow-y:auto;word-break:break-all;font-family:monospace">' + dbgLines.map(l => '<div>' + l + '</div>').join('') + '</div></details>';

  if (state.board) {
    // Board view
    const cols = days.length;
    html += '<div class="board-wrap"><div style="min-width:' + (cols*85+130) + 'px">' +
      '<div class="board" style="grid-template-columns:120px repeat(' + cols + ',minmax(80px,1fr))">' +
      '<div class="b-hdr" style="text-align:left;font-weight:700">PLAYER</div>';
    days.forEach(d => {
      html += '<div class="b-hdr"><div style="font-weight:700;font-size:9px">' + d.label + '</div><div style="font-size:7px;opacity:0.4">' + d.round + '</div></div>';
    });
    const todayStr = new Date().toISOString().slice(0,10);
    const revealed = days.map(d => dayRevealed(d));
    state.players.forEach(p => {
      const pp = state.picks[p] || {};
      const isMe = p === state.player;
      const el = isElim(p);
      html += '<div class="b-cell" style="font-weight:700;color:' + (el?"var(--red)":"var(--text)") + ';background:' + (el?"var(--red-dim)":"var(--surface)") + '">' + (el?"\u2620\uFE0F ":"") + esc(p) + ' <span style="font-size:8px;opacity:0.3">(' + winCount(p) + 'W)</span></div>';
      days.forEach((d, di) => {
        const t = pp[d.id];
        const show = isMe || revealed[di];
        // Only show won/lost coloring for windows that are fully over (end date < today)
        const r = (t && show && d.dates[d.dates.length-1] < todayStr) ? pickResult(t, d.id) : null;
        const bg = r==="won"?"var(--green-dim)":r==="lost"?"var(--red-dim)":"var(--surface)";
        const c = r==="won"?"var(--green)":r==="lost"?"var(--red)":"var(--text-dim)";
        const dec = r==="lost"?"text-decoration:line-through":"";
        let cell;
        if (t && show) cell = '<span style="' + dec + '">' + esc(t) + '</span>';
        else if (t && !show) cell = '<span style="opacity:0.2">\u{1F512}</span>';
        else cell = '<span style="opacity:0.12">\u2014</span>';
        html += '<div class="b-cell center" style="background:' + bg + ';color:' + c + ';font-size:9px">' + cell + '</div>';
      });
    });
    html += '</div></div></div>';
  } else {
    // Day tabs
    html += '<div class="day-scroll">';
    days.forEach((d, i) => {
      const p = myPicks[d.id];
      const r = p ? pickResult(p, d.id) : null;
      const act = i === state.dayIdx;
      const hasGames = d.games.some(g => g.h.n !== "TBD" || g.l.n !== "TBD");
      let cls = "day-tab";
      if (act) cls += " active";
      else if (r==="won") cls += " has-won";
      else if (r==="lost") cls += " has-lost";
      else if (p) cls += " has-pick";
      if (!hasGames && !act) cls += " dim";
      let pickTag = "";
      if (p) {
        const bg = r==="lost"?"var(--red-dim)":r==="won"?"var(--green-dim)":"var(--yellow-dim)";
        const c = r==="lost"?"var(--red)":r==="won"?"var(--green)":"var(--yellow)";
        const dec = r==="lost"?"text-decoration:line-through;":"";
        pickTag = '<div class="day-pick-tag" style="background:' + bg + ';color:' + c + ';' + dec + '">' + esc(p) + '</div>';
      }
      html += '<button class="' + cls + '" data-day="' + i + '"><div class="day-label">' + d.label + '</div><div class="day-round">' + d.round + '</div>' + pickTag + '</button>';
    });
    html += '</div>';

    // Eliminated banner
    if (elim) {
      html += '<div class="elim-banner">YOU HAVE BEEN ELIMINATED \u2014 picks are locked</div>';
    }

    // Pick banner
    if (dayPick) {
      const r = pickResult(dayPick, day.id);
      const bg = r==="lost"?"var(--red-dim)":r==="won"?"var(--green-dim)":"var(--yellow-dim)";
      const bc = r==="lost"?"rgba(255,82,82,0.15)":r==="won"?"rgba(61,220,132,0.12)":"rgba(255,204,68,0.1)";
      const c = r==="lost"?"var(--red)":r==="won"?"var(--green)":"var(--yellow)";
      const dec = r==="lost"?"text-decoration:line-through;":"";
      const mark = r==="won"?" \u2713":r==="lost"?" \u2717":"";
      const locked = day && dayRevealed(day);
      const changeBtn = !r && !elim && !locked ? '<button class="change-btn" id="changeBtn">CHANGE</button>' : "";
      const lockBadge = !r && locked ? '<span style="font-size:9px;opacity:0.4">\u{1F512} LOCKED</span>' : "";
      html += '<div class="pick-banner" style="background:' + bg + ';border:1px solid ' + bc + '">' +
        '<div><div class="pick-banner-label">YOUR PICK</div><div class="pick-banner-team" style="color:' + c + ';' + dec + '">' + esc(dayPick) + mark + '</div></div>' + changeBtn + lockBadge + '</div>';
    }

    // Matchups
    html += '<div class="matchups">';
    if (day && day.games.length > 0) {
      day.games.forEach((g, gi) => {
        const hn = g.h.n, ln = g.l.n;
        if (hn === "TBD" && ln === "TBD") {
          html += '<div class="matchup-card"><div class="matchup-row" style="opacity:0.15"><div class="tbd-slot">TBD</div><div class="vs">VS</div><div class="tbd-slot">TBD</div></div></div>';
          return;
        }
        const accent = REGION_COLORS[g.r] || "#888";
        let meta = "";
        if (g.r || g.t) {
          meta = '<div class="matchup-meta">' + (g.r?'<span class="matchup-region" style="color:' + accent + '">' + g.r.toUpperCase() + '</span>':"<span></span>") + (g.t?'<span class="matchup-time">' + g.t + ' ET</span>':"") + '</div>';
        }
        html += '<div class="matchup-card" style="animation-delay:' + (gi * 0.02) + 's">' + meta + '<div class="matchup-row">';
        html += teamBtn(hn, g.h.s, dayPick, usedTeams, accent, day.id, elim, ln);
        html += '<div class="vs">VS</div>';
        html += teamBtn(ln, g.l.s, dayPick, usedTeams, accent, day.id, elim, hn);
        html += '</div></div>';
      });
    } else {
      html += '<div class="tbd-msg">Matchups TBD \u2014 check back after earlier rounds</div>';
    }
    html += '</div>';
  }

  app.innerHTML = html;
  bindEvents(days);
}

function teamBtn(name, seed, dayPick, usedTeams, accent, dayId, elim, opponent) {
  if (name === "TBD") return '<div class="team-btn tbd">TBD</div>';

  const picked = dayPick === name;
  const used = usedTeams.includes(name) && !picked;
  // Check result across all dates in this pick window
  const winDates = WINDOW_DATES[dayId] || [];
  const wonToday  = winDates.some(dt => state.results[dt]?.[name] === "won");
  const lostToday = winDates.some(dt => state.results[dt]?.[name] === "lost");
  const opponentLost = opponent && opponent !== "TBD" &&
    winDates.some(dt => state.results[dt]?.[opponent] === "lost");
  const eliminated = teamEliminated(name);
  const lost = lostToday || eliminated;
  const won = wonToday;
  const dis = used || eliminated || (elim && !picked);

  // Only show W/L badge if this specific game is decided within this window
  const gameDecided = opponent && opponent !== "TBD" && (opponentLost || lostToday);

  let cls = "team-btn";
  if (picked) cls += " picked";
  else if (lost) cls += " lost";
  else if (used) cls += " used disabled";
  if (dis && !picked && !lost) cls += " disabled";

  let style = "";
  if (picked) style = "border-color:" + accent + ";background:" + accent + "15;color:" + accent + ";";

  const seedHtml = seed ? '<span class="team-seed">' + seed + '</span>' : "";
  const nameClass = lost ? "team-name struck" : "team-name";
  let badge = "";
  if (picked) badge = '<span style="font-size:13px">\u2713</span>';
  else if (gameDecided && won) badge = '<span style="font-size:9px;color:var(--green)">W</span>';
  else if (gameDecided && lost) badge = '<span style="font-size:9px">\u2717</span>';
  else if (used) badge = '<span class="team-badge">USED</span>';

  return '<button class="' + cls + '" style="' + style + '" data-pick="' + esc(name) + '" data-day="' + dayId + '">' + seedHtml + '<span class="' + nameClass + '">' + esc(name) + '</span>' + badge + '</button>';
}

function bindEvents(days) {
  document.getElementById("boardBtn")?.addEventListener("click", () => { state.board = !state.board; render(); });
  document.getElementById("fetchBtn")?.addEventListener("click", fetchScores);
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeBtn")?.addEventListener("click", () => {
    const d = days[state.dayIdx];
    if (d && dayRevealed(d)) return; // locked
    clearPick(d.id);
  });

  document.querySelectorAll(".day-tab").forEach(el => {
    el.addEventListener("click", () => { state.dayIdx = parseInt(el.dataset.day); render(); });
  });

  document.querySelectorAll(".team-btn[data-pick]").forEach(el => {
    el.addEventListener("click", () => {
      const team = el.dataset.pick;
      const dayId = el.dataset.day;
      if (!team || team === "TBD") return;
      const dayObj = days.find(d => d.id === dayId);
      if (dayObj && dayRevealed(dayObj)) return; // locked
      if (isElim(state.player)) return;
      const myPicks = state.picks[state.player] || {};
      const usedTeams = Object.values(myPicks);
      const dayPick = myPicks[dayId];
      if (teamEliminated(team)) return;
      if (usedTeams.includes(team) && dayPick !== team) return;
      makePick(team, dayId);
    });
  });
}

// Auto-refresh scores every 2 minutes during active games
setInterval(fetchScores, 120000);

// Initial render
render();
</script>
